name: Supabase keep-alive

# Evita que el proyecto gratuito de Supabase (lingua-swipe) se pause por inactividad.
# Hace una consulta pequena a la base de datos cada 3 dias.
on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        env:
          SUPABASE_URL: https://fdunolmseuldrlwniwne.supabase.co
          SUPABASE_KEY: sb_publishable_E3ImtAnxuYbQvtGPM9CrqQ_r9eyLUHR
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/learning_items?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY"
